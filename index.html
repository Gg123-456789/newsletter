<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI助手 · 行业日报 | 2026年10月21日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#4361ee; --primary-light:#eef2ff;
    --bg:#f4f6f9; --card-bg:#ffffff;
    --text-main:#1f2937; --text-sub:#6b7280; --text-light:#9ca3af;
    --insight-bg:#f8fafc; --insight-border:#e2e8f0;
    --impact-bg:#fff7ed; --impact-text:#c2410c;
    --hot:#D64545; --line:#e5e7eb;
    --radius:12px;
    --shadow:0 4px 6px -1px rgba(0,0,0,.05), 0 2px 4px -1px rgba(0,0,0,.03);
    --shadow-hover:0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -2px rgba(0,0,0,.04);
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background-color:var(--bg); color:var(--text-main);
    line-height:1.6; padding-bottom:40px; -webkit-font-smoothing:antialiased;
  }

  /* Header */
  header{
    text-align:center; padding:40px 20px;
    background:linear-gradient(135deg,#4361ee 0%,#3a0ca3 100%);
    color:#fff; border-radius:0 0 24px 24px; margin-bottom:30px;
    box-shadow:0 4px 15px rgba(67,97,238,.3);
  }
  header h1{font-size:28px; font-weight:900; margin-bottom:8px; letter-spacing:1px;}
  header .date{font-size:16px; opacity:.9; font-weight:500;}
  header .window{
    display:inline-block; margin-top:10px; padding:3px 12px;
    font-size:12.5px; opacity:.9; border-radius:999px; background:rgba(255,255,255,.16);
  }

  .container{max-width:800px; margin:0 auto; padding:20px;}

  /* Category Title */
  .category-title{
    display:flex; align-items:center; margin:40px 0 20px;
    font-size:20px; font-weight:800; color:var(--text-main);
  }
  .category-title::before{
    content:""; display:block; width:6px; height:24px;
    background-color:var(--primary); border-radius:3px; margin-right:12px;
  }
  .category-title .en{
    margin-left:auto; font-size:13px; color:var(--text-light);
    font-weight:600; text-transform:uppercase; letter-spacing:1px;
  }

  /* News Card */
  .news-card{
    background:var(--card-bg); border-radius:var(--radius);
    padding:24px; margin-bottom:20px; box-shadow:var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease;
    border:1px solid rgba(0,0,0,.02); position:relative; overflow:hidden;
  }
  .news-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover);}

  .card-header{display:flex; align-items:flex-start; margin-bottom:12px;}
  .number-badge{
    background-color:var(--primary); color:#fff; width:28px; height:28px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; flex-shrink:0; margin-right:12px; margin-top:2px;
    box-shadow:0 2px 4px rgba(67,97,238,.3); font-variant-numeric:tabular-nums;
  }
  .news-title{font-size:17px; font-weight:700; line-height:1.4; color:var(--primary); flex:1;}

  .news-meta{
    font-size:13px; color:var(--text-light); margin-bottom:12px;
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .source-tag{background-color:#f3f4f6; padding:2px 8px; border-radius:4px; font-size:12px;}
  /* 跨域标记：只表示「这条内容同时沾定制和智能」，不是板块 */
  .cross-chip{background-color:#fff7ed; color:#c2410c; border:1px solid #fed7aa;
   padding:1px 7px; border-radius:4px; font-size:12px; font-weight:600;}

  .card-eng{
    display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px;
    color:var(--text-light); margin:-4px 0 12px; font-variant-numeric:tabular-nums;
  }
  .card-eng span{white-space:nowrap;}

  .news-summary{color:var(--text-sub); font-size:15px; margin-bottom:16px; text-align:justify;}

  /* Insight & Impact */
  .insight-box{
    background-color:var(--insight-bg); border:1px solid var(--insight-border);
    border-radius:8px; padding:12px 16px; margin-bottom:10px; font-size:14px;
  }
  .insight-label{font-weight:700; color:var(--text-main); margin-right:6px;}
  .insight-text{color:var(--text-sub);}

  .impact-box{
    background-color:var(--impact-bg); border-radius:8px; padding:12px 16px;
    font-size:14px; color:var(--impact-text); display:flex; align-items:flex-start;
  }
  .impact-icon{margin-right:8px; font-weight:700;}

  /* 简介卡：要点列表 / 作者行 / 本地存档标记 */
  .byline{color:var(--text-main); font-weight:600;}
  .point-list{list-style:none; margin:0 0 14px; padding:0;}
  .point-list li{
    display:flex; align-items:flex-start; gap:10px;
    font-size:14.5px; color:var(--text-sub); line-height:1.62;
    padding:6px 0; border-bottom:1px dashed #eef0f4;
  }
  .point-list li:last-child{border-bottom:0;}
  .pt-no{
    flex:0 0 20px; height:20px; margin-top:2px; border-radius:50%;
    background:#eef2ff; color:var(--primary); font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;
  }
  .pt-tx{flex:1;}
  .card-foot{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:14px;}
  .card-foot .read-more{margin-top:0;}
  .asset-chip{
    font-size:12px; color:#0f766e; background:#ecfdf5; border:1px solid #d1fae5;
    padding:4px 9px; border-radius:6px; white-space:nowrap;
  }

  /* 主轴专区 */
  .axis-title::before{background-color:#c2410c;}
  .axis-title{color:#9a3412;}
  .axis-title .en{color:#fb923c;}
  .axis-card{border-left:4px solid #f97316;}
  .axis-badge{background-color:#f97316; box-shadow:0 2px 4px rgba(249,115,22,.35);}

  .hl{color:#3a0ca3; font-weight:700; font-style:normal;}
  .hl-hot{color:var(--hot); font-weight:700; font-style:normal;}

  /* 社媒热榜 */
  .section-note{
    font-size:12.5px; color:var(--text-light); margin:-10px 0 14px; padding-left:18px;
  }
  .platform-badge{
    color:#fff; width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0; margin-right:12px; margin-top:2px;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .social-card .news-title{font-size:15.5px; font-weight:600; color:var(--text-main);}
  .source-tag-platform{font-weight:600;}

  /* Link Button */
  .read-more{
    display:inline-flex; align-items:center; margin-top:16px;
    color:var(--primary); text-decoration:none; font-size:14px; font-weight:600;
    padding:6px 12px; border-radius:6px; background-color:var(--primary-light);
    transition:background-color .2s;
  }
  .read-more:hover{background-color:#dbe4ff;}
  .read-more::after{content:'→'; margin-left:6px; transition:transform .2s;}
  .read-more:hover::after{transform:translateX(3px);}

  /* Footer */
  footer{
    text-align:center; margin-top:50px; color:var(--text-light); font-size:13px;
    border-top:1px solid var(--line); padding-top:30px;
  }
  .disclaimer{max-width:600px; margin:10px auto 0; font-size:12px; line-height:1.5; opacity:.8;}

  @media (max-width:600px){
    .container{padding:12px;}
    header{padding:30px 15px; margin-bottom:20px;}
    header h1{font-size:24px;}
    .news-card{padding:20px;}
    .news-summary{font-size:14.5px;}
  }
</style>
</head>
